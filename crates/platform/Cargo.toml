[package]
name = "mascate-platform"
description = "App platform module: local database, migrations, app data location and the secret store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# An in-memory secret store for other crates' tests.
test-support = []

[dependencies]
directories.workspace = true
libsql.workspace = true
mascate-kernel.workspace = true
thiserror.workspace = true
keyring-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
chrono.workspace = true
futures.workspace = true
mascate-kernel = { workspace = true, features = ["test-support"] }
mascate-platform = { path = ".", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
