[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
mascate-commerce = { path = "crates/commerce" }
mascate-finance = { path = "crates/finance" }
mascate-integrations = { path = "crates/integrations" }
mascate-kernel = { path = "crates/kernel" }
mascate-marketing = { path = "crates/marketing" }
mascate-platform = { path = "crates/platform" }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
futures = "0.3"
# GPUI is pre-1.0 and moves weekly: pin the exact version and upgrade on purpose (ADR 0001).
gpui-kit = "=0.7.0"
keyring-core = "1"
libsql = { version = "0.9", default-features = false, features = ["core"] }
proptest = "1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# The app's HTTP client: small, blocking, rustls; runs on background threads (ADR 0010).
ureq = "3"
uuid = { version = "1", features = ["v7"] }
windows-native-keyring-store = { version = "1", default-features = false }
# Pure Rust D-Bus and crypto: the Linux packages need no libdbus or OpenSSL.
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
